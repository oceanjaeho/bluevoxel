[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clam-inspect"
version = "0.1.0"
description = "바지락 껍데기 외관검사 S1 실현성 검증 도구"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: 학습까지 포함한 전체 흐름 점검"]
