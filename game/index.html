<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>갯벌 수호대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="손가락 하나로 움직이는 갯벌 생존 게임. 오염 몬스터를 쓰러뜨린 자리마다 갯벌이 되살아나요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<canvas id="cv" aria-label="게임 화면"></canvas>

<div id="hud" hidden>
  <div class="xp" aria-hidden="true"><i id="xpFill"></i></div>
  <div class="hud-top">
    <div class="hud-left">
      <b class="lv" id="lvBadge">1</b>
      <div class="slots" id="slots"></div>
    </div>
    <div class="hud-mid">
      <div class="clock" id="clock">0:00</div>
      <div class="bossbar" id="bossbar" hidden><span id="bossName"></span><div class="bb"><i id="bossFill"></i></div></div>
    </div>
    <div class="hud-right">
      <div class="counters">
        <span class="cnt"><img id="icKill" alt="처치"><b id="kills">0</b></span>
        <span class="cnt carbon"><img id="icCarbon" alt="블루카본"><b id="carbon">0</b><small>t</small></span>
      </div>
      <button class="icon-btn" id="pauseBtn" aria-label="일시정지"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg></button>
    </div>
  </div>
  <div class="alert" id="alert" hidden></div>
  <div class="tip" id="tip" hidden></div>
  <div class="hint" id="hint" hidden><div class="hand" aria-hidden="true"></div><span id="hintText">드래그해서 이동</span></div>
</div>

<section id="title" class="screen" hidden>
  <header class="logo">
    <span class="tag">BLUE VOXEL</span>
    <h1>갯벌 수호대</h1>
    <p class="sub">블루카본 서바이벌</p>
  </header>
  <div class="picker">
    <div class="hero-pick">
      <button class="arrow" id="charPrev" aria-label="이전 생물"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 3 6 10l7 7"/></svg></button>
      <figure class="char" id="charCard">
        <img id="charImg" alt="">
        <figcaption><b id="charName">칠게</b><span id="charTag"></span></figcaption>
      </figure>
      <button class="arrow" id="charNext" aria-label="다음 생물"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7"/></svg></button>
    </div>
    <div class="stages" id="stages"></div>
    <div class="mods" id="mods"></div>
    <button class="play" id="playBtn">출동!</button>
    <p class="best" id="best"></p>
  </div>
  <nav class="dock">
    <span class="pearls"><img id="icPearl" alt="진주"><b id="pearls">0</b></span>
    <button class="dock-btn" id="shopBtn"><img id="icShop" alt="">기지</button>
    <button class="dock-btn" id="codexBtn"><img id="icCodex" alt="">도감</button>
    <button class="dock-btn" id="soundBtn" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"/><path class="wave" d="M13 7a4 4 0 0 1 0 6M15 5a7 7 0 0 1 0 10"/></svg><span id="soundLabel">소리</span></button>
  </nav>
</section>

<section id="levelup" class="screen modal" hidden aria-label="레벨 업">
  <div class="lv-head"><h2>LEVEL UP</h2><span id="lvNum">Lv 2</span></div>
  <div class="cards" id="cards"></div>
  <button class="ghost" id="rerollBtn" hidden>다시 뽑기 <b id="rerolls">0</b></button>
</section>

<section id="chest" class="screen modal" hidden aria-label="보물 상자">
  <div class="chest-box"><div class="rays" aria-hidden="true"></div><img id="chestImg" alt="보물 상자"></div>
  <div class="chest-items" id="chestItems"></div>
  <button class="primary" id="chestOk" hidden>좋아!</button>
</section>

<section id="pause" class="screen modal" hidden aria-label="일시정지">
  <div class="panel">
    <h2>일시정지</h2>
    <div class="build" id="pauseBuild"></div>
    <div class="toggles" id="toggles"></div>
    <div class="row">
      <button class="primary" id="resumeBtn">계속하기</button>
      <button class="ghost" id="quitBtn">그만하기</button>
    </div>
  </div>
</section>

<section id="result" class="screen modal" hidden aria-label="결과">
  <div class="panel result">
    <h2 id="resTitle">갯벌을 지켰어요!</h2>
    <p class="res-sub" id="resSub"></p>
    <div class="maps">
      <figure><canvas id="mapBefore"></canvas><figcaption>처음</figcaption></figure>
      <svg class="to" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6"/></svg>
      <figure><canvas id="mapAfter"></canvas><figcaption id="resPct">복원 0%</figcaption></figure>
    </div>
    <div class="stats" id="resStats"></div>
    <div class="gain"><img id="icPearl2" alt="진주"><b>+<span id="resPearls">0</span></b><span class="newbest" id="newBest" hidden>최고 기록!</span></div>
    <p class="unlock" id="resUnlock" hidden></p>
    <p class="fact" id="resFact"><img id="factImg" alt=""><span id="factText"></span></p>
    <div class="row">
      <button class="primary" id="againBtn">다시 하기</button>
      <button class="ghost" id="resShopBtn">기지</button>
      <button class="ghost" id="homeBtn">처음으로</button>
    </div>
  </div>
</section>

<section id="shop" class="screen modal" hidden aria-label="수호대 기지">
  <div class="panel wide">
    <div class="m-head"><h2>수호대 기지</h2><span class="pearls"><img id="icPearl3" alt="진주"><b id="shopPearls">0</b></span><button class="ghost x" id="shopClose">닫기</button></div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</section>

<section id="codex" class="screen modal" hidden aria-label="도감">
  <div class="panel wide">
    <div class="m-head"><h2>도감</h2><span class="count" id="codexCount"></span><button class="ghost x" id="codexClose">닫기</button></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabAlly" aria-selected="true">갯벌 친구</button>
      <button role="tab" id="tabFoe" aria-selected="false">오염 몬스터</button>
      <button role="tab" id="tabAch" aria-selected="false">업적</button>
    </div>
    <div class="ach-list" id="achList" hidden></div>
    <div class="codex-detail" id="codexDetail"><img id="cdImg" alt=""><div><b id="cdName"></b><p id="cdText"></p></div></div>
    <div class="codex-grid" id="codexGrid"></div>
  </div>
</section>

<div id="toast" role="status" hidden></div>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
